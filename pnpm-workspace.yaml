packages:
  - "packages/*"

# pnpm 10+ reads its settings here rather than from .npmrc.
saveExact: true

# esbuild ships a platform binary from its install script; vitest needs it.
allowBuilds:
  esbuild: true
  # better-sqlite3 ships prebuilds; the install script only compiles when none matches the ABI.
  better-sqlite3: true
  # node-pty ships prebuilds; the install script only compiles when none matches the platform.
  node-pty: true
  # electron downloads its own binary from its install script; the desktop shell runs on it.
  electron: true
  # electron-builder pulls this in for Windows targets; its install script is not needed on a Mac build.
  electron-winstaller: false
